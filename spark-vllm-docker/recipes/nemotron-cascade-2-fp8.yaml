# Recipe: Nemotron-Cascade-2-30B-A3B (FP8)
# STATUS: BROKEN — vLLM 0.19.x on-the-fly FP8 fails with MoE weight shape
#   mismatch (AssertionError in fused_moe/layer.py _load_w13).
#   NemotronH MoE architecture not yet compatible with FP8 quantization path.
#   Tested 2026-04-04. Use BF16 recipe instead.
#
# MoE hybrid Mamba-Transformer, 30B total / 3B active params
# Supports thinking mode (<think> tags) and instruct mode
# Uses patched chat template to enable parallel tool calls
# Requires vLLM >= 0.17.1
#
# Usage:
#   ./run-recipe.sh nemotron-cascade-2-fp8 --solo --setup

recipe_version: "1"
name: Nemotron-Cascade-2-30B-A3B-FP8
description: vLLM serving Nemotron-Cascade-2-30B-A3B (FP8 on-the-fly, EXPERIMENTAL)

model: nvidia/Nemotron-Cascade-2-30B-A3B

container: vllm-node-tf5

solo_only: true

mods: []

env: {}

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  max_num_seqs: 8

chat_template: nemotron-cascade-2-chat-template.jinja

command: |
  vllm serve nvidia/Nemotron-Cascade-2-30B-A3B \
     --max-model-len {max_model_len} \
     --max-num-seqs {max_num_seqs} \
     --port {port} --host {host} \
     --trust-remote-code \
     --enable-auto-tool-choice \
     --tool-call-parser qwen3_coder \
     --reasoning-parser nemotron_v3 \
     --mamba-ssm-cache-dtype float32 \
     --enable-prefix-caching \
     --load-format fastsafetensors \
     --gpu-memory-utilization {gpu_memory_utilization} \
     --quantization fp8 --kv-cache-dtype fp8 \
     --chat-template /root/.cache/huggingface/nemotron-cascade-2-chat-template.jinja
