# Recipe: Nemotron-3-Nano-NVFP4
# Nemotron-3-Nano model with NVFP4 quantization support
# Currently can only be run in solo mode, cluster mode fails with error
#
# NOTE: CUTLASS NVFP4 MoE kernels use tcgen05 instructions unsupported on sm_121.
# Use Marlin backend instead (~50 t/s vs ~20 t/s with CUTLASS on GB10).
# See: https://forums.developer.nvidia.com/t/marlin-fix-nvfp4-actually-works-on-sm121-dgx-spark/365119

recipe_version: "1"
name: Nemotron-3-Nano-NVFP4
description: vLLM serving Nemotron-3-Nano-NVFP4 on a SINGLE NODE ONLY!

# HuggingFace model to download (optional, for --download-model)
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4

# Container image to use
container: vllm-node

# This model can only run on single node (solo)
solo_only: true

# No mods required
mods:
  - mods/nemotron-nano

# Environment variables
# FlashInfer FP4 MoE is the fastest path on sm_121 (~67 t/s reported)
env:
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_FLASHINFER_MOE_BACKEND: "latency"

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  max_num_seqs: 16

# The vLLM serve command template
# - No --moe-backend flag: auto-selects FlashInfer via env vars
# - Shorter context (131K) to maximize KV cache for batching
# - Higher gpu_memory_utilization (0.9) since model is only ~15 GB
# - quantization flag explicitly set for optimal FP4 path
command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4  \
     --quantization modelopt_fp4 \
     --max-model-len {max_model_len} \
     --max-num-seqs {max_num_seqs} \
     --port {port} --host {host} \
     --trust-remote-code \
     --enable-auto-tool-choice  \
     --tool-call-parser qwen3_coder \
     --reasoning-parser-plugin nano_v3_reasoning_parser.py \
     --reasoning-parser nano_v3  \
     --kv-cache-dtype fp8  \
     --enable-prefix-caching  \
     --load-format fastsafetensors  \
     --gpu-memory-utilization {gpu_memory_utilization}
