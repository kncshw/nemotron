# Recipe: Nemotron-Cascade-2-30B-A3B
# BF16 model (~63 GB) — fits on single GB10 (128 GB unified memory)
# Supports thinking mode (<think> tags) and instruct mode
# Requires vLLM >= 0.17.1
#
# Usage:
#   ./run-recipe.sh nemotron-cascade-2 --solo --setup

recipe_version: "1"
name: Nemotron-Cascade-2-30B-A3B
description: vLLM serving Nemotron-Cascade-2-30B-A3B (BF16, thinking + instruct)

model: nvidia/Nemotron-Cascade-2-30B-A3B

container: vllm-node

solo_only: true

mods: []

env: {}

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  max_num_seqs: 8

command: |
  vllm serve nvidia/Nemotron-Cascade-2-30B-A3B \
     --max-model-len {max_model_len} \
     --max-num-seqs {max_num_seqs} \
     --port {port} --host {host} \
     --trust-remote-code \
     --enable-auto-tool-choice \
     --tool-call-parser qwen3_coder \
     --reasoning-parser nemotron_v3 \
     --mamba-ssm-cache-dtype float32 \
     --enable-prefix-caching \
     --load-format fastsafetensors \
     --gpu-memory-utilization {gpu_memory_utilization} \
     --chat-template recipes/nemotron-cascade-2-chat-template.jinja
