# Recipe: Nemotron-3-Nano-NVFP4 (CUTLASS fallback)
# Original CUTLASS backend — use this if FlashInfer FP4 MoE fails
# Known to work on GB10 at ~20 t/s (slower but stable)
#
# Usage:
#   ./run-recipe.sh nemotron-3-nano-nvfp4-cutlass --solo --setup

recipe_version: "1"
name: Nemotron-3-Nano-NVFP4-CUTLASS-Fallback
description: vLLM serving Nemotron-3-Nano-NVFP4 using CUTLASS kernels (fallback)

model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4

container: vllm-node

solo_only: true

mods:
  - mods/nemotron-nano

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4  \
     --moe-backend cutlass \
     --max-model-len {max_model_len} \
     --port {port} --host {host} \
     --trust-remote-code \
     --enable-auto-tool-choice  \
     --tool-call-parser qwen3_coder \
     --reasoning-parser-plugin nano_v3_reasoning_parser.py \
     --reasoning-parser nano_v3  \
     --kv-cache-dtype fp8  \
     --enable-prefix-caching  \
     --load-format fastsafetensors  \
     --gpu-memory-utilization {gpu_memory_utilization}
