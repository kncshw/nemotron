# Recipe: Nemotron-3-Nano-FP8
# Nemotron-3-Nano-30B with FP8 quantization (~30 GB weights)
# 30B total params, ~3.5B active per token (MoE)
# Solo mode only (fits easily on single GB10)

recipe_version: "1"
name: Nemotron-3-Nano-FP8
description: vLLM serving Nemotron-3-Nano-30B-A3B-FP8 on a SINGLE NODE

# HuggingFace model to download (optional, for --download-model)
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8

# Container image to use
container: vllm-node

# Single node only
solo_only: true

# Same mod as NVFP4 — downloads the nano_v3 reasoning parser
mods:
  - mods/nemotron-nano

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144

# The vLLM serve command template
command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8  \
     --moe-backend cutlass \
     --max-model-len {max_model_len} \
     --port {port} --host {host} \
     --trust-remote-code \
     --enable-auto-tool-choice  \
     --tool-call-parser qwen3_coder \
     --reasoning-parser-plugin nano_v3_reasoning_parser.py \
     --reasoning-parser nano_v3  \
     --kv-cache-dtype fp8  \
     --enable-prefix-caching  \
     --load-format fastsafetensors  \
     --gpu-memory-utilization {gpu_memory_utilization}
