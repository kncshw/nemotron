# Recipe: Nemotron-3-Super-NVFP4 (CUTLASS fallback)
# Original CUTLASS backend — use this if FlashInfer FP4 MoE fails
# Known to work on GB10 at ~16-17 t/s (slower but stable)
#
# Usage:
#   ./run-recipe.sh nemotron-3-super-nvfp4-cutlass --solo --setup

recipe_version: "1"
name: Nemotron-3-Super-NVFP4-CUTLASS-Fallback
description: vLLM serving Nemotron-3-Super-120B using CUTLASS kernels (fallback)

model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
container: vllm-node
cluster_only: false
solo_only: false

mods:
  - mods/nemotron-super

container: vllm-node
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_seqs: 10

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
  --kv-cache-dtype fp8 \
  --moe-backend cutlass \
  --trust-remote-code \
  --gpu-memory-utilization {gpu_memory_utilization} \
  --max-model-len {max_model_len} \
  --max-num-seqs {max_num_seqs} \
  --enable-prefix-caching \
  --host {host} \
  --port {port} \
  --enable-auto-tool-choice \
  --load-format fastsafetensors \
  --tool-call-parser qwen3_coder \
  --reasoning-parser-plugin super_v3_reasoning_parser.py \
  --reasoning-parser super_v3 \
  --tensor-parallel-size {tensor_parallel} \
  --distributed-executor-backend ray
