# Recipe: Nemotron-3-Super-NVFP4
# Optimized for GB10 (sm_121) using FlashInfer FP4 MoE
#
# NOTE: CUTLASS NVFP4 MoE kernels use tcgen05 instructions unsupported on sm_121,
# causing degraded fallback (~16-17 t/s). FlashInfer FP4 MoE avoids this.
# See: https://forums.developer.nvidia.com/t/dgx-spark-nemotron3-and-nvfp4-getting-to-65-tps/355261

recipe_version: "1"
name: Nemotron-3-Super-NVFP4-FlashInfer-Optimized
description: vLLM serving Nemotron-3-Super-120B using FlashInfer FP4 MoE

model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
container: vllm-node
cluster_only: false
solo_only: false

mods:
  - mods/nemotron-super

container: vllm-node

# FlashInfer FP4 MoE — avoids broken CUTLASS tcgen05 kernels on sm_121
env:
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_FLASHINFER_MOE_BACKEND: "latency"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_seqs: 10

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
  --quantization modelopt_fp4 \
  --kv-cache-dtype fp8 \
  --trust-remote-code \
  --gpu-memory-utilization {gpu_memory_utilization} \
  --max-model-len {max_model_len} \
  --max-num-seqs {max_num_seqs} \
  --enable-prefix-caching \
  --host {host} \
  --port {port} \
  --enable-auto-tool-choice \
  --load-format fastsafetensors \
  --tool-call-parser qwen3_coder \
  --reasoning-parser-plugin super_v3_reasoning_parser.py \
  --reasoning-parser super_v3 \
  --tensor-parallel-size {tensor_parallel} \
  --distributed-executor-backend ray